trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:

# -------------------------
# BUILD STAGE
# -------------------------
- stage: Build
  displayName: "Build Stage"
  jobs:
  - job: BuildJob
    displayName: "Build Job"
    steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK'
        inputs:
          packageType: 'sdk'
          version: '8.0.421'

      - script: |
          echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/dotnet"
          echo "##vso[task.setvariable variable=DOTNET_ROOT]$(Agent.ToolsDirectory)/dotnet"
          echo "##vso[task.setvariable variable=PATH]$(Agent.ToolsDirectory)/dotnet;$(PATH)"
          dotnet --info
        displayName: 'Force .NET 8 SDK path'

      - task: DotNetCoreCLI@2
        displayName: 'Restore'
        inputs:
          command: 'restore'
          projects: '**/*.csproj'

      - task: DotNetCoreCLI@2
        displayName: 'Build'
        inputs:
          command: 'build'
          projects: '**/*.csproj'
          arguments: '--configuration $(buildConfiguration)'

      - task: DotNetCoreCLI@2
        displayName: 'Test'
        inputs:
          command: 'test'
          projects: 'tests/BootcampWebApp.Tests/BootcampWebApp.Tests.csproj'
          arguments: '--configuration $(buildConfiguration)'
          publishTestResults: true

      - task: DotNetCoreCLI@2
        displayName: 'Publish'
        inputs:
          command: 'publish'
          publishWebProjects: true
          arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
          zipAfterPublish: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact'
        inputs:
          pathToPublish: '$(Build.ArtifactStagingDirectory)'
          artifactName: 'drop'
          publishLocation: 'Container'

# -------------------------
# DEV DEPLOYMENT
# -------------------------
- stage: Deploy
  displayName: "Deploy to Dev"
  dependsOn: Build
  jobs:
  - deployment: DeployDev
    displayName: "Deploy to Dev App Service"
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
            - task: DownloadBuildArtifacts@1
              displayName: "Download Build Artifact"
              inputs:
                buildType: 'current'
                artifactName: 'drop'
                downloadPath: '$(Pipeline.Workspace)'

            - task: AzureWebApp@1
              displayName: "Deploy to Dev App Service"
              inputs:
                azureSubscription: 'AzureConnection'
                appType: 'webApp'
                appName: 'bootcampwebapp-dev'
                package: '$(Pipeline.Workspace)/drop/**/*.zip'

# -------------------------
# STAGING DEPLOYMENT
# -------------------------
- stage: Deploy_Staging
  displayName: "Deploy to Staging"
  dependsOn: Deploy
  jobs:
  - deployment: DeployStaging
    displayName: "Deploy to Staging App Service"
    environment: 'Staging'
    strategy:
      runOnce:
        deploy:
          steps:
            - task: DownloadBuildArtifacts@1
              displayName: "Download Build Artifact"
              inputs:
                buildType: 'current'
                artifactName: 'drop'
                downloadPath: '$(Pipeline.Workspace)'

            - task: AzureWebApp@1
              displayName: "Deploy to Staging App Service"
              inputs:
                azureSubscription: 'AzureConnection'
                appType: 'webApp'
                appName: 'bootcampwebapp-staging'
                package: '$(Pipeline.Workspace)/drop/**/*.zip'

# -------------------------
# PRODUCTION DEPLOYMENT
# -------------------------
- stage: Deploy_Production
  displayName: "Deploy to Production"
  dependsOn: Deploy_Staging
  jobs:
  - deployment: DeployProd
    displayName: "Deploy to Production App Service"
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
            - task: DownloadBuildArtifacts@1
              displayName: "Download Build Artifact"
              inputs:
                buildType: 'current'
                artifactName: 'drop'
                downloadPath: '$(Pipeline.Workspace)'

            - task: AzureWebApp@1
              displayName: "Deploy to Production App Service"
              inputs:
                azureSubscription: 'AzureConnection'
                appType: 'webApp'
                appName: 'bootcampwebapp-prod'
                package: '$(Pipeline.Workspace)/drop/**/*.zip'
